<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img
          class="card__avatar"
          src="image-avatar.webp"
          alt="Steven Johnson"
        />
        <h1 class="card__name">Steven Johnson</h1>
        <p class="card__location">London, United Kingdom</p>
      </div>
      <p class="job">"front-end developer and avid reader"</p>
      <div class="list">
        <p><a href="">Github</a></p>
        <p><a href="">Frontend Mentor</a></p>
        <p><a href="">LinkedIn</a></p>
        <p><a href="">Twitter</a></p>
        <p><a href="">Instagram</a></p>
      </div>
    </div>
  </body>
</html>
